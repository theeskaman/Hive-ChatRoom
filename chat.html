<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover">
    <title>HIVE 1.8.4</title>
    <style>
        :root{--bf:16px;--bg:#0b0f19;--s:#151c2c;--sl:#1e293b;--p:#a78bfa;--a:#f472b6;--t:#e2e8f0;--tm:#94a3b8;--b:rgba(255,255,255,0.08);--r:18px;--rl:24px}
        *{margin:0;padding:0;box-sizing:border-box}html{font-size:var(--bf)}body{background:var(--bg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--t);height:100dvh;overflow:hidden;display:flex;justify-content:center;align-items:center}
        .app{width:100%;height:100%;max-width:600px;background:rgba(21,28,44,0.6);backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(168,85,247,0.08)}
        @media(min-width:640px){.app{border-radius:var(--rl);margin:16px;height:calc(100% - 32px);border:1px solid var(--b)}}
        .login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(11,15,25,0.95);backdrop-filter:blur(20px);display:flex;justify-content:center;align-items:center;z-index:200;transition:opacity .4s}
        .login-box{background:rgba(21,28,44,0.8);backdrop-filter:blur(20px);border:1px solid var(--b);border-radius:var(--rl);padding:2rem;width:90%;max-width:360px;text-align:center;animation:fadeInScale .5s ease}
        @keyframes fadeInScale{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
        .login-box h2{font-size:1.8rem;margin-bottom:1.5rem;background:linear-gradient(to right,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
        .login-box input{width:100%;padding:0.8rem 1rem;border-radius:25px;background:#0f172a;border:1px solid #334155;color:#f1f5f9;font-size:0.9rem;margin-bottom:1rem;outline:none}
        .login-box input:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(167,139,250,0.3)}
        .login-box button{width:100%;padding:0.8rem;border-radius:25px;background:linear-gradient(135deg,#7c3aed,#ec4899);border:none;color:white;font-weight:bold;font-size:1rem;cursor:pointer}
        .header{background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(236,72,153,0.1));padding:1.2rem 1.5rem;border-bottom:1px solid var(--b);text-align:center;flex-shrink:0}
        .header h1{font-size:1.6rem;font-weight:800;background:linear-gradient(to right,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;animation:titlePulse 3s ease-in-out infinite alternate}
        @keyframes titlePulse{from{filter:brightness(1)}to{filter:brightness(1.3)}}
        .badge{font-size:0.7rem;background:rgba(45,55,72,0.8);display:inline-block;padding:0.3rem 1rem;border-radius:20px;margin-top:0.3rem;color:#cbd5e0;letter-spacing:0.5px;border:1px solid var(--b);backdrop-filter:blur(4px)}
        .stats-bar{display:flex;background:rgba(0,0,0,0.3);backdrop-filter:blur(12px);padding:0.6rem 1rem;gap:0.6rem;border-bottom:1px solid var(--b);overflow-x:auto;white-space:nowrap;flex-shrink:0}
        .stat{background:linear-gradient(135deg,#1e293b,#0f172a);padding:0.4rem 1rem;border-radius:30px;font-size:0.75rem;font-weight:500;display:flex;align-items:center;gap:0.4rem;border:1px solid var(--b);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
        .stat-icon{font-size:0.9rem}
        .messages-container{flex:1;overflow-y:auto;padding:1rem;padding-bottom:100px;display:flex;flex-direction:column;gap:0.8rem;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
        .msg{display:flex;gap:0.7rem;background:rgba(30,41,59,0.5);backdrop-filter:blur(8px);border-radius:var(--r);padding:0.8rem;border:1px solid var(--b);animation:fadeInUp .3s ease}
        .msg.pinned{background:rgba(244,114,182,0.15); border-left:3px solid #f472b6;}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(0.6rem)}to{opacity:1;transform:translateY(0)}}
        .msg:hover{background:rgba(51,65,85,0.6);border-color:rgba(255,255,255,0.1)}
        .av{width:2.4rem;height:2.4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.85rem;color:white;flex-shrink:0;border:2px solid rgba(255,255,255,0.2)}
        .mc{flex:1}
        .mh{display:flex;align-items:baseline;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.3rem}
        .un{font-weight:700;color:var(--p);font-size:0.85rem}
        .tm{font-size:0.65rem;color:var(--tm)}
        .reply-badge{font-size:0.65rem;background:rgba(71,85,105,0.7);padding:0.2rem 0.6rem;border-radius:20px;color:#e2e8f0;border:1px solid rgba(255,255,255,0.1)}
        .mt{font-size:0.9rem;line-height:1.45;margin:0.4rem 0;word-break:break-word;cursor:pointer;padding:0.2rem 0}
        .rb{background:none;border:1px solid #475569;color:#cbd5e0;font-size:0.7rem;padding:0.3rem 0.8rem;border-radius:20px;cursor:pointer;transition:0.2s}
        .rb:hover{background:var(--p);border-color:var(--p);color:white}
        #inputArea{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;background:rgba(15,23,42,0.9);backdrop-filter:blur(12px);border-top:1px solid var(--b);padding:0.8rem 1rem;padding-bottom:calc(0.8rem + env(safe-area-inset-bottom,0px));z-index:10}
        .reply-indicator{background:#4c1d95;border-radius:25px;padding:0.5rem 1rem;margin-bottom:0.6rem;font-size:0.75rem;display:flex;justify-content:space-between;align-items:center;animation:slideDown .2s ease}
        @keyframes slideDown{from{opacity:0;transform:translateY(-0.5rem)}to{opacity:1;transform:translateY(0)}}
        .cancel-reply{background:#ef4444;border:none;color:white;padding:0.2rem 1rem;border-radius:20px;cursor:pointer;font-size:0.7rem;font-weight:600}
        .input-row{display:flex;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap}
        .input-row input#msg_input{flex:1 1 auto;background:#0f172a;border:1px solid #334155;padding:0.7rem 1rem;border-radius:25px;color:#f1f5f9;font-size:0.85rem;outline:none;transition:border .2s,box-shadow .2s;min-width:0}
        .input-row input#msg_input:focus{border-color:var(--p);box-shadow:0 0 0 2px rgba(167,139,250,0.3)}
        .send-button{background:linear-gradient(135deg,#7c3aed,#ec4899);border:none;border-radius:25px;padding:0 1.4rem;font-weight:700;color:white;cursor:pointer;white-space:nowrap;font-size:0.85rem;transition:transform .1s}
        .send-button:disabled{opacity:0.6;cursor:not-allowed}
        .send-button:active:not(:disabled){transform:scale(0.95)}
        .menu-buttons{display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-top:0.4rem}
        .menu-buttons a,.menu-buttons button{background:rgba(51,65,85,0.7);backdrop-filter:blur(4px);padding:0.35rem 0.9rem;border-radius:20px;font-size:0.7rem;color:#cbd5e0;text-decoration:none;border:1px solid rgba(255,255,255,0.1);cursor:pointer}
        .toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:#334155;color:white;padding:0.5rem 1.2rem;border-radius:20px;font-size:0.8rem;opacity:0;transition:opacity .3s;z-index:1000;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2)}
        #systemLogPanel{background:rgba(30,41,59,0.9);padding:0.6rem 1rem;border-bottom:1px solid var(--b);max-height:8rem;overflow-y:auto;display:none}
        .system-log-item{font-size:0.75rem;padding:0.3rem 0;border-bottom:1px solid rgba(255,255,255,0.05);color:#f87171}
        .char-counter{font-size:0.7rem;margin-left:0.5rem;color:#94a3b8}
        .char-counter.warning{color:#f97316}
        .char-counter.danger{color:#ef4444}
        .notification-toggle{background:rgba(167,139,250,0.3) !important;border-color:#a78bfa !important}
        @media(max-width:400px){:root{--bf:14px}.header h1{font-size:1.4rem}.stat{padding:0.3rem 0.8rem;font-size:0.7rem}.av{width:2rem;height:2rem;font-size:0.75rem}.msg{padding:0.7rem}.input-row{flex-wrap:wrap}.input-row input#msg_input{padding:0.6rem 0.8rem}.send-button{padding:0.6rem 1.2rem;width:100%}}
    </style>
</head>
<body>
<div id="loginOverlay" class="login-overlay"><div class="login-box"><h2>💬 Welcome to HIVE</h2><input type="text" id="loginName" placeholder="Choose your username" maxlength="20"><button onclick="doLogin()">Enter Chat</button></div></div>
<div class="app" id="appMain" style="display:none">
    <div class="header"><h1>💬 HIVE ChatRoom 1.8.4</h1><div class="badge">⚡ Alpha · v1.8.4</div></div>
    <div class="stats-bar" id="statsBar">
        <div class="stat" id="tempStat"><span class="stat-icon">🌡️</span> --</div>
        <div class="stat" id="humStat"><span class="stat-icon">💧</span> --</div>
        <div class="stat" id="uptimeStat"><span class="stat-icon">⏱️</span> --</div>
        <div class="stat" id="msgCountStat"><span class="stat-icon">💬</span> 0</div>
    </div>
    <div id="systemLogPanel"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:0.8rem;color:#94a3b8">⚙️ System Issues</span><button onclick="document.getElementById('systemLogPanel').style.display='none'" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:1.2rem">✖</button></div><div id="systemLogContent"></div></div>
    <div class="messages-container" id="msgContainer"><!-- پیام‌ها توسط جاوااسکریپت اضافه می‌شوند --></div>
    <div id="inputArea">
        <div id="replyIndicator" style="display:none" class="reply-indicator"><span id="replyInfoText"></span><button class="cancel-reply" onclick="clearReply()">Cancel</button></div>
        <form id="msgForm">
            <div class="input-row"><input type="text" id="msg_input" name="msg" placeholder="Type a message (max 400 chars)..." maxlength="400" required><span id="charCounter" class="char-counter">0/400</span><input type="hidden" id="reply_to" name="reply" value="0"><button class="send-button" type="submit" id="sendBtn">Send</button></div>
        </form>
        <div class="menu-buttons"><button onclick="location.reload()">🔄 Refresh</button><a href="/download_msgs" target="_blank">⬇️ Msgs</a><a href="/download_temps" target="_blank">🌡️ Log</a><button onclick="toggleScroll()">📌 Scroll</button><button onclick="changeName()">🔄 Change name</button><button id="notifyBtn" class="notification-toggle">🔔 Enable Notifications</button></div>
    </div>
</div>
<div id="toast" class="toast"></div>
<script>
    // ========== متغیرهای سراسری ==========
    let lastMsgId = 0;
    let currentReplyTo = 0;
    let currentReplyName = '';
    let scrollAuto = true;
    let sending = false;
    let currentUser = '';
    let notificationsEnabled = false;
    
    // ========== توابع پایه ==========
    function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) return;
        t.innerText = msg;
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 1800);
    }
    
    function fixMessagePadding() {
        let i = document.getElementById('inputArea');
        let m = document.getElementById('msgContainer');
        if (i && m) m.style.paddingBottom = (i.offsetHeight + 8) + 'px';
    }
    
    function simpleHash(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xFFFFFFFF;
        return h;
    }
    
    function formatRelativeTime(ts) {
        if (!ts) return '';
        let d = Math.floor(Date.now() / 1000) - ts;
        if (d < 60) return 'just now';
        if (d < 3600) return Math.floor(d / 60) + ' min ago';
        if (d < 86400) return Math.floor(d / 3600) + ' h ago';
        return Math.floor(d / 86400) + ' d ago';
    }
    
    function updateAllTimes() {
        document.querySelectorAll('.tm').forEach(el => {
            let ts = parseInt(el.dataset.timestamp);
            if (ts) el.innerText = formatRelativeTime(ts);
        });
    }
    
    function copyText(el) {
        navigator.clipboard.writeText(el.innerText);
        showToast('📋 Copied!');
    }
    
    function toggleScroll() {
        scrollAuto = !scrollAuto;
        showToast(scrollAuto ? 'Auto-scroll ON' : 'Auto-scroll OFF');
    }
    
    function clearReply() {
        currentReplyTo = 0;
        currentReplyName = '';
        document.getElementById('reply_to').value = '0';
        document.getElementById('replyIndicator').style.display = 'none';
    }
    
    function appendSystemLog(text) {
        let c = document.getElementById('systemLogContent');
        let p = document.getElementById('systemLogPanel');
        if (!c || !p) return;
        let d = document.createElement('div');
        d.className = 'system-log-item';
        d.textContent = text;
        c.appendChild(d);
        p.style.display = 'block';
        while (c.children.length > 12) c.removeChild(c.firstChild);
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    function appendServerMessage(msg) {
        let c = document.getElementById('msgContainer');
        if (!c) return;
        if (document.querySelector(`.msg[data-id='${msg.id}']`)) return;
        let hue = Math.abs(simpleHash(msg.user)) % 360;
        let avStyle = `background:hsl(${hue},70%,55%);`;
        let replyBadge = (msg.reply && msg.reply_user) ? `<span class="reply-badge">↩️ ${escapeHtml(msg.reply_user)}</span>` : '';
        let div = document.createElement('div');
        div.className = 'msg';
        div.dataset.id = msg.id;
        div.dataset.username = msg.user;
        div.dataset.time = msg.timestamp;
        div.innerHTML = `<div class="av" style="${avStyle}">${escapeHtml(msg.user.substring(0,2).toUpperCase())}</div>
                        <div class="mc">
                            <div class="mh"><span class="un">${escapeHtml(msg.user)}</span><span class="tm" data-timestamp="${msg.timestamp}"></span>${replyBadge}</div>
                            <div class="mt" onclick="copyText(this)">${escapeHtml(msg.text)}</div>
                            <div class="ma"><button class="rb" data-id="${msg.id}" data-name="${escapeHtml(msg.user)}">💬 Reply</button></div>
                        </div>`;
        div.querySelector('.rb').onclick = (e) => {
            e.stopPropagation();
            currentReplyTo = msg.id;
            currentReplyName = msg.user;
            document.getElementById('reply_to').value = currentReplyTo;
            document.getElementById('replyIndicator').style.display = 'flex';
            document.getElementById('replyInfoText').innerText = 'Replying to ' + currentReplyName;
            document.getElementById('msg_input').focus();
        };
        c.appendChild(div);
        if (scrollAuto) c.scrollTop = c.scrollHeight;
        if (msg.user === 'System' && msg.text.startsWith('⚠️')) appendSystemLog(msg.text);
        if (notificationsEnabled && Notification.permission === 'granted' && msg.user !== currentUser) {
            let n = new Notification(`💬 from ${msg.user}`, { body: msg.text.length > 60 ? msg.text.substring(0,57)+'...' : msg.text, icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23a78bfa"%3E%3Cpath d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4l4 4 4-4h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"%3E%3C/path%3E%3C/svg%3E' });
            n.onclick = () => { let m = document.querySelector(`.msg[data-id='${msg.id}']`); if(m) m.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
            setTimeout(() => n.close(), 5000);
        }
    }
    
    // ========== توابع شبکه ==========
    async function pollNewMessages() {
        if (sending) return;
        try {
            let r = await fetch(`/api/msg_poll?since=${lastMsgId}`);
            let d = await r.json();
            if (!d.messages || !d.messages.length) return;
            for (let msg of d.messages) appendServerMessage(msg);
            let maxId = Math.max(...d.messages.map(m => m.id));
            if (!isNaN(maxId)) lastMsgId = maxId;
            if (d.total !== undefined) document.getElementById('msgCountStat').innerHTML = '<span class="stat-icon">💬</span> ' + d.total;
        } catch(e) { console.error('Poll error:', e); }
    }
    
    async function updateStats() {
        try {
            let r = await fetch('/api/stats');
            let s = await r.json();
            document.getElementById('tempStat').innerHTML = '<span class="stat-icon">🌡️</span> ' + s.temp;
            document.getElementById('humStat').innerHTML = '<span class="stat-icon">💧</span> ' + s.hum;
            document.getElementById('uptimeStat').innerHTML = '<span class="stat-icon">⏱️</span> ' + s.uptime;
            document.getElementById('msgCountStat').innerHTML = '<span class="stat-icon">💬</span> ' + s.msg_count;
        } catch(e) { console.error('Stats error:', e); }
    }
    
    function setupCharCounter() {
        let input = document.getElementById('msg_input');
        let counter = document.getElementById('charCounter');
        if (!input || !counter) return;
        input.addEventListener('input', function() {
            let len = this.value.length;
            counter.innerText = len + '/400';
            counter.classList.remove('warning','danger');
            if (len > 360) counter.classList.add('danger');
            else if (len > 280) counter.classList.add('warning');
        });
    }
    
    function setupNotifications() {
        if (!('Notification' in window)) { 
            let btn = document.getElementById('notifyBtn');
            if (btn) btn.style.display = 'none';
            return; 
        }
        let btn = document.getElementById('notifyBtn');
        if (!btn) return;
        let pref = localStorage.getItem('notifications_enabled');
        if (pref === 'true' && Notification.permission === 'granted') { 
            notificationsEnabled = true; 
            btn.innerText = '🔕 Notifications ON'; 
        } else btn.innerText = '🔔 Enable Notifications';
        btn.onclick = () => {
            if (Notification.permission === 'granted') {
                notificationsEnabled = !notificationsEnabled;
                localStorage.setItem('notifications_enabled', notificationsEnabled);
                btn.innerText = notificationsEnabled ? '🔕 Notifications ON' : '🔔 Enable Notifications';
                showToast(notificationsEnabled ? 'Notifications ON' : 'Notifications OFF');
            } else if (Notification.permission === 'default') {
                Notification.requestPermission().then(perm => {
                    if (perm === 'granted') { 
                        notificationsEnabled = true; 
                        localStorage.setItem('notifications_enabled','true'); 
                        btn.innerText = '🔕 Notifications ON'; 
                        showToast('Notifications enabled'); 
                    }
                });
            } else showToast('Notifications blocked');
        };
    }
    
    function attachReplyHandlers() {
        document.querySelectorAll('.rb').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                currentReplyTo = parseInt(btn.dataset.id);
                currentReplyName = btn.dataset.name;
                document.getElementById('reply_to').value = currentReplyTo;
                document.getElementById('replyIndicator').style.display = 'flex';
                document.getElementById('replyInfoText').innerText = 'Replying to ' + currentReplyName;
                document.getElementById('msg_input').focus();
            };
        });
    }
    
    function initApp() {
        console.log('initApp called');
        try {
            updateAllTimes();
            setInterval(updateAllTimes, 60000);
            attachReplyHandlers();
            setInterval(pollNewMessages, 3000);
            setInterval(updateStats, 5000);
            updateStats();
            setupNotifications();
            setupCharCounter();
            console.log('initApp finished');
        } catch(e) { console.error('Init error:', e); showToast('Init error: ' + e.message); }
    }
    
    function doLogin() {
        console.log('doLogin called');
        let name = document.getElementById('loginName').value.trim();
        if (!name) { showToast('Please enter a name'); return; }
        currentUser = name;
        localStorage.setItem('chat_username', name);
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('appMain').style.display = 'flex';
        fixMessagePadding();
        setTimeout(() => initApp(), 100);
    }
    
    function changeName() {
        localStorage.removeItem('chat_username');
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('appMain').style.display = 'none';
        document.getElementById('loginName').value = '';
        currentUser = '';
        notificationsEnabled = false;
        let btn = document.getElementById('notifyBtn');
        if (btn) btn.innerText = '🔔 Enable Notifications';
    }
    
    // ========== رویداد ارسال فرم ==========
    document.getElementById('msgForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (sending || !currentUser) return;
        let msg = document.getElementById('msg_input').value.trim();
        if (!msg) { showToast('Message cannot be empty'); return; }
        if (msg.length > 400) { showToast('Message too long'); return; }
        let reply = document.getElementById('reply_to').value;
        sending = true;
        let btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.textContent = '⏳';
        try {
            let r = await fetch('/send?' + new URLSearchParams({ name: currentUser, msg, reply, ajax: '1' }));
            let d = await r.json();
            if (d.success) {
                let msgObj = { id: d.id, user: currentUser, text: msg, reply: parseInt(reply), reply_user: currentReplyName, timestamp: Math.floor(Date.now() / 1000) };
                appendServerMessage(msgObj);
                lastMsgId = d.id;
                document.getElementById('msgCountStat').innerHTML = '<span class="stat-icon">💬</span> ' + d.total;
                document.getElementById('msg_input').value = '';
                clearReply();
                document.getElementById('charCounter').innerText = '0/400';
            } else showToast('Error sending message');
        } catch(err) { showToast('Network error - retry'); }
        finally { sending = false; btn.disabled = false; btn.textContent = 'Send'; document.getElementById('msg_input').focus(); }
    });
    
    // ========== بارگذاری اولیه ==========
    window.onload = () => {
        console.log('Window loaded');
        let savedName = localStorage.getItem('chat_username');
        if (savedName) {
            currentUser = savedName;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appMain').style.display = 'flex';
            fixMessagePadding();
            setTimeout(() => initApp(), 100);
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('appMain').style.display = 'none';
            document.getElementById('loginName').focus();
        }
        window.addEventListener('resize', fixMessagePadding);
    };
</script>
</body>
</html>
