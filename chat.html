<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>HIVE 1.9.3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-base: #030712;
            --bg-surface: rgba(17, 24, 39, 0.75);
            --bg-elevated: rgba(31, 41, 55, 0.6);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #6c7a91;
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
            --accent-glow: rgba(129, 140, 248, 0.3);
            --own-msg-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.15));
            --other-msg-bg: rgba(30, 41, 59, 0.7);
            --input-bg: #0f172a;
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            --glass-blur: blur(16px);
            --transition-default: all 0.2s ease;
        }
        body.light {
            --bg-base: #f1f5f9;
            --bg-surface: rgba(255, 255, 255, 0.75);
            --bg-elevated: rgba(226, 232, 240, 0.7);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #475569;
            --accent-primary: #4f46e5;
            --accent-secondary: #d946ef;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --own-msg-bg: linear-gradient(135deg, rgba(79, 70, 229, 0.12), rgba(217, 70, 239, 0.08));
            --other-msg-bg: rgba(255, 255, 255, 0.85);
            --input-bg: #ffffff;
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            --glass-blur: blur(12px);
        }
        body {
            background: var(--bg-base);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: var(--text-primary);
            height: 100dvh;
            overflow: hidden;
            transition: background 0.3s, color 0.2s;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 10px; }
        .app {
            max-width: 650px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border-left: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
        }
        @media (min-width: 768px) {
            .app {
                margin: 16px auto;
                height: calc(100% - 32px);
                border-radius: 2rem;
                border: 1px solid var(--border-light);
            }
        }
        .header {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title-section h1 {
            font-size: 1.65rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .badge {
            font-size: 0.7rem;
            background: rgba(255,255,255,0.1);
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            color: var(--text-secondary);
            backdrop-filter: blur(4px);
        }
        .theme-toggle {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 40px;
            padding: 0.4rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition-default);
            backdrop-filter: blur(4px);
        }
        .theme-toggle:hover { background: var(--accent-primary); color: white; }
        .stats-bar {
            display: flex;
            gap: 0.8rem;
            padding: 0.7rem 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
        }
        .stat {
            background: var(--bg-elevated);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }
        .stat-icon { font-size: 1rem; }
        .pinned-bar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.8rem;
            color: var(--accent-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            scroll-behavior: smooth;
        }
        .msg {
            display: flex;
            gap: 0.8rem;
            max-width: 88%;
            animation: fadeSlideUp 0.25s ease-out;
        }
        .msg.self { align-self: flex-end; flex-direction: row-reverse; }
        .msg.self .mc { align-items: flex-end; }
        .msg.self .mh { flex-direction: row-reverse; }
        .msg.self .un { color: var(--accent-secondary); }
        .msg:not(.self) { align-self: flex-start; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .av {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            color: white;
            background: #8b5cf6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            flex-shrink: 0;
            border: 1.5px solid rgba(255,255,255,0.3);
        }
        .mc { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .mh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .un { font-weight: 700; font-size: 0.85rem; color: var(--accent-primary); letter-spacing: -0.2px; }
        .tm { font-size: 0.65rem; color: var(--text-muted); }
        .reply-badge {
            background: rgba(129, 140, 248, 0.2);
            border-radius: 20px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            backdrop-filter: blur(2px);
        }
        .mt {
            font-size: 0.9rem;
            line-height: 1.45;
            word-break: break-word;
            background: var(--other-msg-bg);
            padding: 0.6rem 1rem;
            border-radius: 1.4rem;
            border-top-left-radius: 0.3rem;
            cursor: pointer;
            transition: var(--transition-default);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-light);
            max-width: 100%;
        }
        .msg.self .mt {
            background: var(--own-msg-bg);
            border-bottom-right-radius: 0.3rem;
            border-top-left-radius: 1.4rem;
            border-color: rgba(129,140,248,0.3);
            color: var(--text-primary);
        }
        .mt:hover { transform: scale(1.01); background: rgba(129,140,248,0.15); }
        .ma {
            margin-top: 2px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .rb, .reaction-btn, .reaction-add {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 500;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            transition: 0.2s;
        }
        .rb:hover, .reaction-btn:hover, .reaction-add:hover {
            color: var(--accent-primary);
            background: rgba(129,140,248,0.2);
        }
        .reaction-btn.active { background: var(--accent-primary); color: white; }
        .reaction-menu {
            position: relative;
            display: inline-block;
        }
        .reaction-dropdown {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background: var(--bg-elevated);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 0.3rem;
            gap: 0.3rem;
            z-index: 100;
            border: 1px solid var(--border-light);
            flex-wrap: nowrap;
        }
        .reaction-dropdown button {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 30px;
            transition: 0.1s;
        }
        .reaction-dropdown button:hover {
            background: rgba(129,140,248,0.3);
            transform: scale(1.1);
        }
        #inputArea {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-light);
            padding: 0.8rem 1rem;
            padding-bottom: calc(0.8rem + env(safe-area-inset-bottom, 0px));
        }
        .reply-indicator {
            background: var(--accent-primary);
            border-radius: 60px;
            padding: 0.5rem 1rem;
            margin-bottom: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
        }
        .cancel-reply {
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 0.2rem 1rem;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .input-row {
            display: flex;
            gap: 0.7rem;
            align-items: center;
            flex-wrap: wrap;
        }
        #msg_input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            border-radius: 3rem;
            padding: 0.8rem 1.2rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        #msg_input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .send-button {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 3rem;
            padding: 0 1.8rem;
            height: 48px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .send-button:active { transform: scale(0.96); }
        .char-counter {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 0.3rem;
        }
        .menu-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.7rem;
            justify-content: center;
        }
        .menu-buttons button, .menu-buttons a {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-light);
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-buttons button:hover, .menu-buttons a:hover {
            background: var(--accent-primary);
            color: white;
        }
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.96);
            backdrop-filter: blur(24px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .login-box {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem 1.8rem;
            width: 90%;
            max-width: 360px;
            text-align: center;
            border: 1px solid var(--border-light);
            animation: fadeScale 0.3s ease;
        }
        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.96);}
            to { opacity: 1; transform: scale(1);}
        }
        .login-box h2 {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
        }
        .login-box input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            outline: none;
        }
        .login-box button {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            padding: 0.8rem;
            width: 100%;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-bottom: 0.5rem;
        }
        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            backdrop-filter: blur(12px);
            pointer-events: none;
            white-space: nowrap;
        }
        @media (max-width: 500px) {
            .msg { max-width: 95%; }
            .stat { font-size: 0.7rem; padding: 0.3rem 0.8rem; }
        }
    </style>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>HIVE</h2>
        <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="showRegister()">Register</button>
        
        <!-- News Panel -->
        <div id="newsPanel" style="margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--border-light); font-size: 0.75rem; text-align: left; color: var(--text-muted);">
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 5px;">
                <span>📰</span> <strong>Latest News</strong>
                <span id="newsTime" style="font-size:0.65rem;"></span>
            </div>
            <div id="newsContent" style="word-break: break-word; max-height: 120px; overflow-y: auto; padding-right: 5px;">Loading...</div>
        </div>
    </div>
</div>

<div class="app" id="appMain" style="display: none;">
    <div class="header">
        <div class="title-section">
            <h1>💬 HIVE ChatRoom</h1>
            <div class="badge">Stable · v1.9.3</div>
        </div>
        <button class="theme-toggle" id="globalThemeToggle" aria-label="Toggle theme">🌙 Dark</button>
    </div>

    <div id="pinnedBar" class="pinned-bar" style="display: none;">
        <span id="pinnedText"></span>
        <button id="unpinBtn" style="background: none; border: none; color: var(--accent-primary); cursor: pointer;">✖</button>
    </div>

    <div class="stats-bar" id="statsBar">
        <div class="stat" id="tempStat"><span class="stat-icon">🌡️</span> --</div>
        <div class="stat" id="humStat"><span class="stat-icon">💧</span> --</div>
        <div class="stat" id="uptimeStat"><span class="stat-icon">⏱️</span> --</div>
        <div class="stat" id="msgCountStat"><span class="stat-icon">💬</span> 0</div>
    </div>

    <div class="messages-container" id="msgContainer"></div>

    <div id="inputArea">
        <div id="replyIndicator" style="display:none" class="reply-indicator">
            <span id="replyInfoText"></span>
            <button class="cancel-reply" onclick="clearReply()">Cancel</button>
        </div>
        <form id="msgForm">
            <div class="input-row">
                <input type="text" id="msg_input" placeholder="Type a message (max 400 chars)..." maxlength="400" autocomplete="off">
                <span id="charCounter" class="char-counter">0/400</span>
                <input type="hidden" id="reply_to" value="0">
                <button class="send-button" type="submit" id="sendBtn">Send</button>
            </div>
        </form>
        <div class="menu-buttons">
            <button onclick="location.reload()">🔄 Refresh</button>
            <a href="/download_temps" target="_blank">🌡️ Log</a>
            <button onclick="toggleScroll()">📌 Scroll</button>
            <button onclick="logout()">🚪 Logout</button>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ---------- core globals ----------
    let lastMsgId = 0;
    let currentReplyTo = 0;
    let currentReplyName = '';
    let scrollAuto = true;
    let sending = false;
    let currentUser = '';

    function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) return;
        t.innerText = msg;
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 1800);
    }

    function toggleScroll() {
        scrollAuto = !scrollAuto;
        showToast(scrollAuto ? 'Auto-scroll ON' : 'Auto-scroll OFF');
    }

    function clearReply() {
        currentReplyTo = 0;
        currentReplyName = '';
        document.getElementById('reply_to').value = '0';
        document.getElementById('replyIndicator').style.display = 'none';
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    // ========== LOGIN / REGISTER (GET) ==========
    async function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!username || !password) { showToast('Enter credentials'); return; }
        try {
            const res = await fetch(`/api/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
            const data = await res.json();
            if (data.success) {
                currentUser = username;
                localStorage.setItem('chat_username', username);
                localStorage.setItem('chat_password', password);
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appMain').style.display = 'flex';
                initApp();
            } else {
                showToast('Login failed: ' + (data.message || 'Invalid credentials'));
            }
        } catch(e) {
            showToast('Network error');
        }
    }

    async function showRegister() {
        const u = prompt('New username (min 2 chars):');
        if (!u) return;
        const p = prompt('Password (min 4 chars):');
        if (!p) return;
        try {
            const res = await fetch(`/api/register?username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
            const data = await res.json();
            if (data.success) {
                showToast('Registered! You can now login.');
            } else {
                showToast('Error: ' + (data.message || 'Registration failed'));
            }
        } catch(e) {
            showToast('Network error');
        }
    }

    function logout() {
        localStorage.removeItem('chat_username');
        localStorage.removeItem('chat_password');
        currentUser = '';
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('appMain').style.display = 'none';
        clearReply();
    }

    // ========== NEWS FETCH ==========
    async function fetchNews() {
        try {
            const res = await fetch('/api/news');
            const data = await res.json();
            if (data.success && data.news) {
                const newsDiv = document.getElementById('newsContent');
                const formatted = data.news.replace(/\n/g, '<br>');
                newsDiv.innerHTML = formatted;
                document.getElementById('newsTime').innerText = new Date().toLocaleTimeString();
            } else {
                document.getElementById('newsContent').innerHTML = '📡 No news available';
            }
        } catch(e) {
            document.getElementById('newsContent').innerHTML = '⚠️ Could not load news';
        }
    }

    // ========== SEND MESSAGE ==========
    async function sendMessage() {
        if (sending || !currentUser) return;
        let msg = document.getElementById('msg_input').value.trim();
        if (!msg) { showToast('Message cannot be empty'); return; }
        if (msg.length > 400) { showToast('Message too long'); return; }
        let reply = currentReplyTo;
        let password = localStorage.getItem('chat_password');
        if (!password) { logout(); return; }
        sending = true;
        let btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.textContent = '⏳';
        try {
            const url = `/send?username=${encodeURIComponent(currentUser)}&password=${encodeURIComponent(password)}&msg=${encodeURIComponent(msg)}&reply=${reply}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.success) {
                document.getElementById('msg_input').value = '';
                clearReply();
                document.getElementById('charCounter').innerText = '0/400';
                await pollMessages();
            } else {
                showToast(data.message || 'Send failed');
                if (data.error === 'auth') logout();
            }
        } catch(err) {
            showToast('Network error');
        } finally {
            sending = false;
            btn.disabled = false;
            btn.textContent = 'Send';
            document.getElementById('msg_input').focus();
        }
    }

    // ========== POLL MESSAGES (with pinned) ==========
    async function pollMessages() {
        if (!currentUser) return;
        try {
            const r = await fetch(`/api/msg_poll?since=${lastMsgId}`);
            const d = await r.json();
            if (d.messages?.length) {
                for (let msg of d.messages) appendMessage(msg);
                let maxId = Math.max(...d.messages.map(m => m.id));
                if (!isNaN(maxId)) lastMsgId = maxId;
            }
            document.getElementById('msgCountStat').innerHTML = '<span class="stat-icon">💬</span> ' + (d.total || 0);
            if (d.pinned && d.pinned.id) {
                document.getElementById('pinnedText').innerHTML = `📌 Pinned: ${escapeHtml(d.pinned.user)}: ${escapeHtml(d.pinned.text.substring(0, 80))}`;
                document.getElementById('pinnedBar').style.display = 'flex';
            } else {
                document.getElementById('pinnedBar').style.display = 'none';
            }
        } catch(e) { console.warn(e); }
    }

    // ========== STATS ==========
    async function updateStats() {
        try {
            const r = await fetch('/api/stats');
            const s = await r.json();
            document.getElementById('tempStat').innerHTML = '<span class="stat-icon">🌡️</span> ' + s.temp;
            document.getElementById('humStat').innerHTML = '<span class="stat-icon">💧</span> ' + s.hum;
            document.getElementById('uptimeStat').innerHTML = '<span class="stat-icon">⏱️</span> ' + s.uptime;
        } catch(e) {}
    }

    // ========== REACTION ==========
    async function sendReaction(msgId, emoji) {
        const username = currentUser;
        const password = localStorage.getItem('chat_password');
        if (!username || !password) return;
        try {
            const url = `/api/reaction?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&msg_id=${msgId}&emoji=${encodeURIComponent(emoji)}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.success && data.reactions) {
                updateMessageReactions(msgId, data.reactions);
            }
        } catch(e) {
            console.warn('Reaction error:', e);
        }
    }

    function updateMessageReactions(msgId, newReactions) {
        const msgDiv = document.querySelector(`.msg[data-id='${msgId}']`);
        if (!msgDiv) return;
        const reactionsContainer = msgDiv.querySelector('.reactions');
        if (!reactionsContainer) return;
        
        let newHtml = '';
        for (const [emoji, users] of Object.entries(newReactions)) {
            const active = users.includes(currentUser) ? 'active' : '';
            newHtml += `<button class="reaction-btn ${active}" data-msgid="${msgId}" data-emoji="${emoji}">${emoji} ${users.length}</button>`;
        }
        reactionsContainer.innerHTML = newHtml;
        
        reactionsContainer.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                const mid = parseInt(btn.dataset.msgid);
                const em = btn.dataset.emoji;
                await sendReaction(mid, em);
            };
        });
    }

    function appendMessage(msg) {
        let container = document.getElementById('msgContainer');
        if (document.querySelector(`.msg[data-id='${msg.id}']`)) return;

        let isSelf = (currentUser && msg.user === currentUser);
        let hue = Math.abs((msg.user.split('').reduce((a,b)=>a+b.charCodeAt(0),0) % 360));
        let avStyle = `background: hsl(${hue}, 70%, 58%);`;
        let replyBadge = (msg.reply && msg.reply_user) ? `<span class="reply-badge">↩️ ${escapeHtml(msg.reply_user)}</span>` : '';

        let reactionsHtml = '';
        if (msg.reactions) {
            for (let [emoji, users] of Object.entries(msg.reactions)) {
                let active = users.includes(currentUser) ? 'active' : '';
                reactionsHtml += `<button class="reaction-btn ${active}" data-msgid="${msg.id}" data-emoji="${emoji}">${emoji} ${users.length}</button>`;
            }
        }

        const emojiList = ['👍', '❤️', '😂', '😮', '😢', '😡'];
        let dropdownId = `dropdown-${msg.id}`;
        let reactionAddHtml = `
            <div class="reaction-menu">
                <button class="reaction-add" onclick="toggleReactionMenu('${dropdownId}')">➕</button>
                <div id="${dropdownId}" class="reaction-dropdown">
                    ${emojiList.map(e => `<button onclick="sendReaction(${msg.id}, '${e}')">${e}</button>`).join('')}
                </div>
            </div>
        `;

        let msgDiv = document.createElement('div');
        msgDiv.className = `msg ${isSelf ? 'self' : ''}`;
        msgDiv.dataset.id = msg.id;
        msgDiv.dataset.username = msg.user;

        msgDiv.innerHTML = `
            <div class="av" style="${avStyle}">${escapeHtml(msg.user.substring(0,2).toUpperCase())}</div>
            <div class="mc">
                <div class="mh">
                    <span class="un">${escapeHtml(msg.user)}</span>
                    <span class="tm" data-timestamp="${msg.timestamp}">${msg.time}</span>
                    ${replyBadge}
                </div>
                <div class="mt" onclick="copyText(this)">${escapeHtml(msg.text)}</div>
                <div class="ma">
                    <button class="rb" data-id="${msg.id}" data-name="${escapeHtml(msg.user)}">💬 Reply</button>
                    <div class="reactions" style="display:inline-flex; gap:4px;">${reactionsHtml}</div>
                    ${reactionAddHtml}
                </div>
            </div>
        `;

        const replyBtn = msgDiv.querySelector('.rb');
        replyBtn.onclick = (e) => {
            e.stopPropagation();
            currentReplyTo = msg.id;
            currentReplyName = msg.user;
            document.getElementById('reply_to').value = currentReplyTo;
            document.getElementById('replyIndicator').style.display = 'flex';
            document.getElementById('replyInfoText').innerText = 'Replying to ' + currentReplyName;
            document.getElementById('msg_input').focus();
        };

        msgDiv.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                const mid = parseInt(btn.dataset.msgid);
                const em = btn.dataset.emoji;
                await sendReaction(mid, em);
            };
        });

        container.appendChild(msgDiv);
        if (scrollAuto) container.scrollTop = container.scrollHeight;
    }

    function toggleReactionMenu(dropdownId) {
        const dropdown = document.getElementById(dropdownId);
        if (dropdown.style.display === 'flex') {
            dropdown.style.display = 'none';
        } else {
            document.querySelectorAll('.reaction-dropdown').forEach(d => d.style.display = 'none');
            dropdown.style.display = 'flex';
            setTimeout(() => { dropdown.style.display = 'none'; }, 3000);
        }
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.reaction-menu')) {
            document.querySelectorAll('.reaction-dropdown').forEach(d => d.style.display = 'none');
        }
    });

    function copyText(el) {
        navigator.clipboard.writeText(el.innerText);
        showToast('📋 Copied!');
    }

    function setupCharCounter() {
        let input = document.getElementById('msg_input');
        let counter = document.getElementById('charCounter');
        if (!input) return;
        input.addEventListener('input', () => {
            let len = input.value.length;
            counter.innerText = `${len}/400`;
        });
    }

    function initTheme() {
        const stored = localStorage.getItem('theme_mode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let theme = stored ? stored : (prefersDark ? 'dark' : 'light');
        applyTheme(theme);
        const toggleBtn = document.getElementById('globalThemeToggle');
        if (toggleBtn) {
            toggleBtn.innerText = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
            toggleBtn.onclick = () => {
                let newTheme = document.body.classList.contains('light') ? 'dark' : 'light';
                applyTheme(newTheme);
                localStorage.setItem('theme_mode', newTheme);
                toggleBtn.innerText = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
            };
        }
    }
    function applyTheme(theme) {
        if (theme === 'light') {
            document.body.classList.add('light');
            document.body.classList.remove('dark-theme');
        } else {
            document.body.classList.remove('light');
            document.body.classList.add('dark-theme');
        }
    }

    function initApp() {
        updateStats();
        pollMessages();
        setInterval(pollMessages, 2800);
        setInterval(updateStats, 5500);
        setupCharCounter();
        document.getElementById('msgForm').addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });
        document.getElementById('unpinBtn').addEventListener('click', async () => {
            const password = localStorage.getItem('chat_password');
            if (!password) return;
            await fetch(`/api/admin?username=${encodeURIComponent(currentUser)}&password=${encodeURIComponent(password)}&cmd=unpin`);
            pollMessages();
        });
    }

    window.onload = () => {
        initTheme();
        fetchNews();
        setInterval(fetchNews, 30000);
        const savedUser = localStorage.getItem('chat_username');
        const savedPass = localStorage.getItem('chat_password');
        if (savedUser && savedPass) {
            currentUser = savedUser;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appMain').style.display = 'flex';
            initApp();
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('loginUsername').focus();
        }
    };
</script>
</body>
</html>
