<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>HIVE · Update Manager</title>
    <style>
        /* ----- RESET & GLOBAL (دقیقاً همان استایل chat.html) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-base: #030712;
            --bg-surface: rgba(17, 24, 39, 0.75);
            --bg-elevated: rgba(31, 41, 55, 0.6);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #6c7a91;
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
            --accent-glow: rgba(129, 140, 248, 0.3);
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            --glass-blur: blur(16px);
            --stat-bg: rgba(31, 41, 55, 0.6);
            --input-bg: #0f172a;
        }

        body.light {
            --bg-base: #f1f5f9;
            --bg-surface: rgba(255, 255, 255, 0.75);
            --bg-elevated: rgba(226, 232, 240, 0.7);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #475569;
            --accent-primary: #4f46e5;
            --accent-secondary: #d946ef;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            --glass-blur: blur(12px);
            --stat-bg: rgba(226, 232, 240, 0.7);
            --input-bg: #ffffff;
        }

        body {
            background: var(--bg-base);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: var(--text-primary);
            height: 100dvh;
            overflow: hidden;
            transition: background 0.3s, color 0.2s;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 10px; }

        .app {
            max-width: 650px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border-left: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
        }

        @media (min-width: 768px) {
            .app {
                margin: 16px auto;
                height: calc(100% - 32px);
                border-radius: 2rem;
                border: 1px solid var(--border-light);
            }
        }

        .header {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .title-section h1 {
            font-size: 1.65rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .badge {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            color: var(--text-secondary);
            backdrop-filter: blur(4px);
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 40px;
            padding: 0.4rem 0.9rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .theme-toggle:hover { background: var(--accent-primary); color: white; }

        .stats-bar {
            display: flex;
            gap: 0.8rem;
            padding: 0.7rem 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
        }

        .stat {
            background: var(--stat-bg);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem 1rem;
        }

        .update-card {
            background: var(--bg-elevated);
            backdrop-filter: blur(12px);
            border-radius: 1.4rem;
            border: 1px solid var(--border-light);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
        }

        .update-card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        select, input, button {
            width: 100%;
            padding: 0.8rem;
            border-radius: 40px;
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            margin-bottom: 1rem;
            outline: none;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.97); }

        .file-list {
            background: var(--bg-surface);
            border-radius: 20px;
            padding: 0.5rem;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border-light);
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.85rem;
        }
        .file-item:last-child { border-bottom: none; }

        .delete-btn {
            background: #ef4444;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            width: auto;
            margin-bottom: 0;
        }

        .status {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 20px;
            display: none;
            font-size: 0.85rem;
        }
        .success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #4ade80; }
        .error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; }

        .menu-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.7rem 1rem 1rem 1rem;
            justify-content: center;
        }
        .menu-buttons button, .menu-buttons a {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-light);
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-buttons button:hover, .menu-buttons a:hover {
            background: var(--accent-primary);
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 1000;
            backdrop-filter: blur(12px);
            white-space: nowrap;
        }

        @media (max-width: 500px) {
            .update-card { padding: 1rem; }
            .stat { font-size: 0.7rem; padding: 0.3rem 0.8rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="title-section">
            <h1>⚙️ HIVE Update Manager</h1>
            <div class="badge">Admin Panel</div>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme">🌙 Dark</button>
    </div>

    <div class="stats-bar">
        <div class="stat"><span>🌡️</span> <span id="tempStat">--</span></div>
        <div class="stat"><span>💧</span> <span id="humStat">--</span></div>
        <div class="stat"><span>⏱️</span> <span id="uptimeStat">--</span></div>
        <div class="stat"><span>💬</span> <span id="msgCountStat">0</span></div>
    </div>

    <div class="content-container">
        <div class="update-card">
            <h2>📤 Upload HTML File</h2>
            <select id="targetSelect">
                <option value="chat.html">Chat Interface (chat.html)</option>
                <option value="update.html">Update Manager (update.html)</option>
                <option value="maintenance.html">Maintenance Page (maintenance.html)</option>
            </select>
            <p class="desc">Sign in as an administrator in the chat page first. This manager uses that temporary session.</p>
            <input type="file" id="fileInput" accept=".html">
            <button id="uploadBtn">🚀 Upload & Replace</button>
            <div id="uploadStatus" class="status"></div>
        </div>

        <div class="update-card">
            <h2>🗂️ File Manager</h2>
            <button id="refreshBtn">🔄 Refresh File List</button>
            <div id="fileList" class="file-list">Loading...</div>
            <div id="deleteStatus" class="status"></div>
        </div>
    </div>

    <div class="menu-buttons">
        <a href="/" target="_blank">💬 Back to Chat</a>
        <button onclick="location.reload()">🔄 Refresh Page</button>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== آمار زنده ==========
    async function updateStats() {
        try {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('tempStat').innerText = data.temp;
            document.getElementById('humStat').innerText = data.hum;
            document.getElementById('uptimeStat').innerText = data.uptime;
            document.getElementById('msgCountStat').innerText = data.msg_count;
        } catch(e) { console.warn('Stats error'); }
    }

    // ========== تم ==========
    function initTheme() {
        const stored = localStorage.getItem('theme_mode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let theme = stored ? stored : (prefersDark ? 'dark' : 'light');
        applyTheme(theme);
        const toggleBtn = document.getElementById('themeToggleBtn');
        if (toggleBtn) {
            toggleBtn.innerText = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
            toggleBtn.onclick = () => {
                let newTheme = document.body.classList.contains('light') ? 'dark' : 'light';
                applyTheme(newTheme);
                localStorage.setItem('theme_mode', newTheme);
                toggleBtn.innerText = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
            };
        }
    }

    function applyTheme(theme) {
        if (theme === 'light') document.body.classList.add('light');
        else document.body.classList.remove('light');
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.opacity = '1';
        setTimeout(() => t.style.opacity = '0', 2000);
    }

    function showStatus(div, msg, type) {
        div.innerText = msg;
        div.className = `status ${type}`;
        div.style.display = 'block';
        setTimeout(() => div.style.display = 'none', 4000);
    }

    // Public read-only requests use GET; management calls use POST with a short-lived session token.
    async function postJson(url, payload) {
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return await res.json();
        } catch (e) {
            return { success: false, message: 'Network error' };
        }
    }

    function currentAdminToken() {
        return sessionStorage.getItem('chat_token') || '';
    }

    // ========== Upload files using POST ==========
    const targetSelect = document.getElementById('targetSelect');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');

    uploadBtn.onclick = async () => {
        const token = currentAdminToken();
        const file = fileInput.files[0];
        if (!token || !file) {
            showStatus(uploadStatus, 'Open the chat page and sign in as an administrator first.', 'error');
            return;
        }
        const target = targetSelect.value;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const base64 = e.target.result.split(',')[1];
            const data = await postJson('/api/update', { token, filename: target, content_base64: base64 });
            if (data.success) {
                showStatus(uploadStatus, `✅ ${target} updated!`, 'success');
                loadFileList();
            } else {
                showStatus(uploadStatus, '❌ ' + (data.message || 'Unknown error'), 'error');
            }
        };
        reader.readAsDataURL(file);
    };

    // ========== Admin-only file list (POST) ==========
    const refreshBtn = document.getElementById('refreshBtn');
    const fileListDiv = document.getElementById('fileList');
    const deleteStatus = document.getElementById('deleteStatus');

    async function loadFileList() {
        fileListDiv.innerHTML = '<div style="padding:0.5rem; text-align:center;">Loading...</div>';
        const token = currentAdminToken();
        if (!token) {
            fileListDiv.innerText = 'Administrator session missing. Sign in from the chat page in this tab first.';
            return;
        }
        const data = await postJson('/api/list_files', { token });
        if (data.success && Array.isArray(data.files)) {
            if (data.files.length === 0) {
                fileListDiv.innerHTML = '<div style="text-align:center;padding:1rem;">No files found.</div>';
                return;
            }
            let html = '';
            for (let f of data.files) {
                let name = f.name.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');
                html += `<div class="file-item">
                            <span>${name} (${f.size} B)</span>
                            <button class="delete-btn" data-name="${name}">🗑️ Delete</button>
                         </div>`;
            }
            fileListDiv.innerHTML = html;
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async () => {
                    const name = btn.dataset.name;
                    const token = currentAdminToken();
                    if (!token) { showStatus(deleteStatus, 'Administrator session missing.', 'error'); return; }
                    const delData = await postJson('/api/delete_file', { token, filename: name });
                    if (delData.success) {
                        showStatus(deleteStatus, '✅ Deleted: ' + name, 'success');
                        loadFileList();
                    } else {
                        showStatus(deleteStatus, '❌ ' + (delData.message || 'Failed'), 'error');
                    }
                };
            });
        } else {
            fileListDiv.innerHTML = '<div class="error" style="padding:0.5rem;">Failed to load: ' + (data.message || 'unknown') + '</div>';
        }
    }

    refreshBtn.onclick = loadFileList;

    // ========== راه‌اندازی ==========
    updateStats();
    setInterval(updateStats, 6000);
    initTheme();
    loadFileList();
</script>
</body>
</html>
