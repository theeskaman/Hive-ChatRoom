<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>HIVE · Maintenance</title>
    <style>
        /* ===== VARIABLES & THEMES (از چت اصلی) ===== */
        :root {
            --bg-base: #030712;
            --bg-surface: rgba(17, 24, 39, 0.75);
            --bg-elevated: rgba(31, 41, 55, 0.6);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #6c7a91;
            --accent-primary: #818cf8;
            --accent-secondary: #c084fc;
            --accent-glow: rgba(129, 140, 248, 0.3);
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            --glass-blur: blur(16px);
            --stat-bg: rgba(31, 41, 55, 0.6);
        }

        body.light {
            --bg-base: #f1f5f9;
            --bg-surface: rgba(255, 255, 255, 0.75);
            --bg-elevated: rgba(226, 232, 240, 0.7);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #475569;
            --accent-primary: #4f46e5;
            --accent-secondary: #d946ef;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            --glass-blur: blur(12px);
            --stat-bg: rgba(226, 232, 240, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-base);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: background 0.3s, color 0.2s;
        }

        /* کارت اصلی (همان طرح اولیه) */
        .maintenance-card {
            max-width: 700px;
            width: 100%;
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            border-radius: 56px;
            border: 1px solid var(--border-light);
            box-shadow: var(--card-shadow);
            padding: 2.5rem 2rem;
            text-align: center;
            transition: all 0.2s;
        }

        /* آیکون متحرک */
        .icon-wrapper {
            display: inline-flex;
            background: linear-gradient(145deg, var(--accent-primary), var(--accent-secondary));
            padding: 1rem;
            border-radius: 80px;
            margin-bottom: 1.5rem;
            box-shadow: 0 12px 24px -8px var(--accent-glow);
            animation: softPulse 2s infinite alternate;
        }
        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            stroke: white;
            stroke-width: 1.5;
            fill: none;
        }

        @keyframes softPulse {
            0% { opacity: 0.6; transform: scale(1);}
            100% { opacity: 1; transform: scale(1.02);}
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(125deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
        }

        .status-badge {
            display: inline-block;
            background: rgba(129, 140, 248, 0.15);
            border-radius: 60px;
            padding: 0.3rem 1.2rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-secondary);
            border: 1px solid rgba(129, 140, 248, 0.5);
            margin-bottom: 2rem;
        }

        .message-box {
            background: var(--bg-elevated);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-light);
        }
        .message-box p {
            font-size: 1.05rem;
            line-height: 1.5;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* شبکه آمار */
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin: 1.8rem 0 1rem;
        }
        .stat-pill {
            background: var(--stat-bg);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border-light);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .stat-icon {
            font-size: 1.2rem;
        }
        .stat-value {
            font-weight: 700;
            color: var(--accent-primary);
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .footer-note button, .footer-note a {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.3rem 0.9rem;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--text-secondary);
            text-decoration: none;
            transition: 0.2s;
        }
        .footer-note button:hover, .footer-note a:hover {
            background: var(--accent-primary);
            color: white;
        }

        .server-status {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .server-led {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4ade80;
            box-shadow: 0 0 4px currentColor;
            transition: background-color 0.2s;
        }
        .server-led.offline {
            background-color: #f87171;
        }

        @media (max-width: 550px) {
            .maintenance-card { padding: 1.8rem 1.2rem; }
            h1 { font-size: 1.7rem; }
            .stat-pill { padding: 0.4rem 0.9rem; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="maintenance-card">
    <div class="icon-wrapper">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </div>
    <h1>We'll be back soon</h1>
    <div class="status-badge">⚙️ HIVE Chatroom · maintenance mode</div>

    <div class="message-box">
        <p>🔧 The chatroom is currently being upgraded.</p>
        <p style="font-size:0.9rem; margin-top:0.5rem;">✨ New version with more features will be available shortly.</p>
    </div>

    <!-- آمار زنده -->
    <div class="stats-grid" id="statsContainer">
        <div class="stat-pill"><span class="stat-icon">🌡️</span> Temp: <span id="tempValue" class="stat-value">--</span></div>
        <div class="stat-pill"><span class="stat-icon">💧</span> Humidity: <span id="humValue" class="stat-value">--</span></div>
        <div class="stat-pill"><span class="stat-icon">⏱️</span> Uptime: <span id="uptimeValue" class="stat-value">--</span></div>
        <div class="stat-pill"><span class="stat-icon">💬</span> Messages: <span id="msgCountValue" class="stat-value">--</span></div>
    </div>

    <div class="footer-note">
        <button class="theme-toggle" id="themeToggleBtn">🌙 Dark mode</button>
        <button id="refreshStatsBtn">⟳ Refresh stats</button>
        <a href="/update" target="_blank">⚙️ Update panel</a>
        <span class="server-status" id="serverStatusWrap">
            <span class="server-led" id="serverLed"></span>
            <span id="serverStatusText">Checking server...</span>
        </span>
    </div>
    <div style="margin-top: 1rem; font-size:0.7rem; opacity:0.7;">
        HIVE chat v1.9.1 · Under maintenance
    </div>
</div>

<script>
    // ========== به‌روزرسانی آمار و وضعیت سرور ==========
    async function fetchStats() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            const response = await fetch('/api/stats', { signal: controller.signal, cache: 'no-store' });
            clearTimeout(timeoutId);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (data && (data.temp !== undefined || data.msg_count !== undefined)) {
                document.getElementById('tempValue').innerText = data.temp ?? '--';
                document.getElementById('humValue').innerText = data.hum ?? '--';
                document.getElementById('uptimeValue').innerText = data.uptime ?? '--';
                document.getElementById('msgCountValue').innerText = data.msg_count ?? '0';
                updateServerStatusUI(true, '● Online');
                return;
            }
            throw new Error('Invalid data');
        } catch (err) {
            console.warn('Stats fetch failed:', err);
            document.getElementById('tempValue').innerText = '--';
            document.getElementById('humValue').innerText = '--';
            document.getElementById('uptimeValue').innerText = '--';
            document.getElementById('msgCountValue').innerText = '--';
            updateServerStatusUI(false, '⚠️ Server unreachable');
        }
    }

    function updateServerStatusUI(isOnline, message) {
        const led = document.getElementById('serverLed');
        const textSpan = document.getElementById('serverStatusText');
        if (led) {
            if (isOnline) led.classList.remove('offline');
            else led.classList.add('offline');
        }
        if (textSpan) textSpan.innerText = message;
    }

    async function refreshStats() {
        const btn = document.getElementById('refreshStatsBtn');
        const originalText = btn.innerText;
        btn.innerText = '🔄 Connecting...';
        btn.disabled = true;
        await fetchStats();
        btn.innerText = originalText;
        btn.disabled = false;
    }

    // ========== تم (هماهنگ با چت اصلی) ==========
    function initTheme() {
        const stored = localStorage.getItem('theme_mode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let theme = stored ? stored : (prefersDark ? 'dark' : 'light');
        applyTheme(theme);
        const toggleBtn = document.getElementById('themeToggleBtn');
        if (toggleBtn) {
            toggleBtn.innerText = theme === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
            toggleBtn.onclick = () => {
                let newTheme = document.body.classList.contains('light') ? 'dark' : 'light';
                applyTheme(newTheme);
                localStorage.setItem('theme_mode', newTheme);
                toggleBtn.innerText = newTheme === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
            };
        }
    }
    function applyTheme(theme) {
        if (theme === 'light') {
            document.body.classList.add('light');
            document.body.classList.remove('dark-theme');
        } else {
            document.body.classList.remove('light');
            document.body.classList.add('dark-theme');
        }
    }

    // ========== راه‌اندازی ==========
    fetchStats();
    setInterval(fetchStats, 8000);
    initTheme();
    document.getElementById('refreshStatsBtn')?.addEventListener('click', refreshStats);
</script>
</body>
</html>
